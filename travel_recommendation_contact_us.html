<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TravelBloom - Contact Us</title>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body, html {
      height: 100%;
      width: 100%;
      overflow-x: hidden;
      color: #ffffff;
    }

    /* Full Background Container */
    .page-wrapper {
      position: relative;
      min-height: 100vh;
      background: linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
                  url('https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
      display: flex;
      flex-direction: column;
    }

    /* --- Navigation Bar --- */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: #0d2830;
      padding: 12px 40px;
      z-index: 10;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      background-color: #ffffff;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
    }

    .brand-title {
      color: #ffffff;
      font-size: 1.5rem;
      font-weight: bold;
      font-style: italic;
    }

    .nav-links {
      display: flex;
      list-style: none;
      gap: 36px;
      margin-right: auto;
      margin-left: 180px;
    }

    .nav-links a {
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .nav-links a:hover {
      opacity: 0.8;
    }

    .nav-links a.active {
      font-weight: bold;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 2px;
    }

    /* --- Main Content Section --- */
    .main-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: relative;
      padding: 0 80px;
    }

    /* Left Social Bar */
    .social-bar {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(13, 40, 48, 0.7);
      display: flex;
      flex-direction: column;
      gap: 22px;
      padding: 20px 14px;
      border-top-right-radius: 4px;
      border-bottom-right-radius: 4px;
      z-index: 5;
    }

    .social-bar a {
      color: #ffffff;
      font-size: 1.1rem;
      text-decoration: none;
      transition: color 0.2s;
    }

    .social-bar a:hover {
      color: #38b6ff;
    }

    /* Left Heading Box */
    .hero-text-box {
      margin-left: 20px;
    }

    .page-title {
      font-size: 3.5rem;
      font-weight: 800;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.6);
      margin-bottom: 24px;
    }

    .subtitle {
      font-size: 1.25rem;
      font-weight: 400;
      text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.6);
    }

    /* Translucent Contact Form Card (Right Side) */
    .contact-card {
      background-color: rgba(13, 40, 48, 0.65);
      backdrop-filter: blur(4px);
      padding: 36px 32px;
      border-radius: 6px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.95rem;
      color: #ffffff;
      font-weight: 500;
    }

    .form-control {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 4px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: #ffffff;
    }

    .form-control::placeholder {
      color: rgba(255, 255, 255, 0.6);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 110px;
    }

    .btn-submit {
      width: 100%;
      background-color: #0d6e64;
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 4px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #09524a;
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <!-- Navbar -->
    <nav class="navbar">
      <a href="travel_recommendation.html" class="nav-brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            <path d="M17.8 8.2l-3.2 2.1 1.2 3.8-3.8-2.5-3.8 2.5 1.2-3.8-3.2-2.1h3.9l1.9-3.8 1.9 3.8z" fill="#000"></path>
          </svg>
        </div>
        <span class="brand-title">TravelBloom</span>
      </a>

      <ul class="nav-links">
        <li><a href="travel_recommendation.html">Home</a></li>
        <li><a href="travel_recommendation_about_us.html">About Us</a></li>
        <li><a href="travel_recommendation_contact_us.html" class="active">Contact Us</a></li>
      </ul>
    </nav>

    <!-- Main Content Area -->
    <main class="main-container">
      <!-- Left Vertical Social Bar -->
      <aside class="social-bar">
        <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
        <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
      </aside>

      <!-- Left Header -->
      <section class="hero-text-box">
        <h1 class="page-title">CONTACT US</h1>
        <p class="subtitle">Get in touch</p>
      </section>

      <!-- Right Contact Form Overlay -->
      <section class="contact-card">
        <form>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
          </div>

          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" class="form-control" placeholder="Enter your message" required></textarea>
          </div>

          <button type="submit" class="btn-submit">Submit</button>
        </form>
      </section>
    </main>
  </div>

</body>
</html>
